worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;

    # Suroi: static client + reverse proxy to the Bun game server.
    # The main server listens on 127.0.0.1:8000 (HTTP API + /team WebSocket).
    # Game servers listen on 127.0.0.1:8001..8000+maxGames (/play WebSocket).
    upstream main_server {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Static files (incl. clientConfig.json). SPA fallback for client routes.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Main server HTTP API: /api/serverInfo, /api/getGame
        location /api/ {
            proxy_pass http://main_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Custom team WebSocket (main server)
        location /team {
            proxy_pass http://main_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Game WebSocket: the client replaces <gameID> in the region's gameAddress
        # with (gameID + offset) and appends "/play". The game server for gameID N
        # listens on port (Config.port + N + 1), so with offset = 8001 a request
        # looks like /play/8001/play. Route it to the matching game server port.
        location ~ ^/play/(\d+)/play$ {
            rewrite ^/play/(\d+)/play$ /play break;
            proxy_pass http://127.0.0.1:$1;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
